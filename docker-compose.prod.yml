services:
  postgres:
    image: postgres:16-alpine
    container_name: st-postgres
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trader_dev_123}
      POSTGRES_DB: stocktrading
    volumes:
      - st_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d stocktrading"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: st-redis
    volumes:
      - st_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/jayantkeswani/stocktrading/backend:latest}
    container_name: st-backend
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trader:${DB_PASSWORD:-trader_dev_123}@postgres:5432/stocktrading
      DATABASE_URL_SYNC: postgresql://trader:${DB_PASSWORD:-trader_dev_123}@postgres:5432/stocktrading
      REDIS_URL: redis://redis:6379/0
      # Persist Intraday Hunter chart PNGs on a named volume — without this the
      # default /tmp lives on the container's ephemeral layer and every deploy
      # (docker compose up recreates st-backend) wipes the chart history.
      INTRADAY_HUNTER_CHART_DIR: /app/intraday_hunter_charts
      # IH v2 teacher ingestion: YouTube blocks the VM's datacenter IP. yt-dlp tries the WARP
      # container first (free) and falls back to the paid residential proxy only when WARP is
      # blocked (IH_YTDLP_RESIDENTIAL_PROXY, a sticky India home IP, written into .env from the
      # GitHub secret by deploy.yml). Without the secret there is no fallback.
      IH_YTDLP_PROXY: socks5h://warp:1080
      IH_YTDLP_PROXY_FALLBACK: ${IH_YTDLP_RESIDENTIAL_PROXY:-}
    volumes:
      - backend_logs:/app/logs
      - st_ih_charts:/app/intraday_hunter_charts
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/tasks"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Cloudflare WARP SOCKS5 proxy for the backend's YouTube downloads (IH v2 teacher ingestion).
  # Reachable only on the compose network as warp:1080 — no host port. The backend does not
  # depend on it: if it is down, only the teacher pulls fail (and alert on Telegram).
  warp:
    image: ${WARP_IMAGE:-ghcr.io/jayantkeswani/stocktrading/warp:latest}
    container_name: st-warp
    # WARP manages routes inside its own network namespace; without NET_ADMIN it never
    # leaves "Connecting" (scoped to this container — the host network is untouched).
    cap_add:
      - NET_ADMIN
    volumes:
      - st_warp_data:/var/lib/cloudflare-warp
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/jayantkeswani/stocktrading/frontend:latest}
    container_name: st-frontend
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: st-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  st_postgres_data:
  st_redis_data:
  backend_logs:
  st_ih_charts:
  st_warp_data:
