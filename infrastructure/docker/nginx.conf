server {
    listen 80;
    server_name _;

    # Re-resolve container IPs via Docker DNS every 5s so nginx
    # picks up new container IPs after deploys without a manual reload.
    resolver 127.0.0.11 valid=5s;
    set $backend_url http://backend:8080;
    set $frontend_url http://frontend:3000;

    client_max_body_size 10M;

    # WebSocket for backend
    location /ws {
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # API routes
    location /api/ {
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # Frontend (everything else)
    location / {
        proxy_pass $frontend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js HMR WebSocket (dev only, harmless in prod)
    location /_next/webpack-hmr {
        proxy_pass $frontend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
