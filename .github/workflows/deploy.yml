name: Deploy to GCP VM

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/jayantkeswani/stocktrading/backend
  FRONTEND_IMAGE: ghcr.io/jayantkeswani/stocktrading/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.prod.yml
            infrastructure/docker/nginx.conf

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync config files to VM
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml deploy@${{ secrets.GCP_VM_IP }}:/opt/stock-trading/
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.GCP_VM_IP }} "mkdir -p /opt/stock-trading/infrastructure/docker"
          scp -i ~/.ssh/deploy_key infrastructure/docker/nginx.conf deploy@${{ secrets.GCP_VM_IP }}:/opt/stock-trading/infrastructure/docker/

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.GCP_VM_IP }} << 'DEPLOY_SCRIPT'
            set -e
            cd /opt/stock-trading

            # Write .env from secrets
            cat > .env << 'ENV_EOF'
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DATABASE_URL=postgresql+asyncpg://trader:${{ secrets.DB_PASSWORD }}@postgres:5432/stocktrading
          DATABASE_URL_SYNC=postgresql://trader:${{ secrets.DB_PASSWORD }}@postgres:5432/stocktrading
          REDIS_URL=redis://redis:6379/0
          FYERS_APP_ID=${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_KEY=${{ secrets.FYERS_SECRET_KEY }}
          FYERS_REDIRECT_URI=${{ secrets.FYERS_REDIRECT_URI }}
          FYERS_USERNAME=${{ secrets.FYERS_USERNAME }}
          FYERS_PIN=${{ secrets.FYERS_PIN }}
          FYERS_TOTP_SECRET=${{ secrets.FYERS_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          RESEARCH_LLM_PROVIDER=gemini
          RESEARCH_LLM_MODEL=gemini-2.5-flash
          TRADING_CAPITAL=1000000
          MAX_DAILY_DRAWDOWN_PCT=5.0
          MAX_RISK_PER_TRADE_PCT=2.0
          MAX_TRADES_PER_DAY=3
          PAPER_TRADING=true
          BACKEND_HOST=0.0.0.0
          BACKEND_PORT=8080
          FRONTEND_URL=http://localhost:3000
          ENV_EOF

            # Login to ghcr.io and pull images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}:latest"
            export FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}:latest"
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'

            docker pull "$BACKEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            # Start DB first, run migrations, then bring up all services
            docker compose -f docker-compose.prod.yml up -d postgres redis
            sleep 5

            # Run migrations via compose run (joins the compose network automatically)
            docker compose -f docker-compose.prod.yml run --rm -T backend \
              python -m alembic upgrade head

            # Now bring up all services
            docker compose -f docker-compose.prod.yml up -d

            # Verify
            sleep 5
            docker compose -f docker-compose.prod.yml ps

            # Cleanup old images
            docker image prune -f

            echo "Deploy complete!"
          DEPLOY_SCRIPT

      - name: Health check
        run: |
          sleep 10
          curl -sf --max-time 10 http://${{ secrets.GCP_VM_IP }}/api/v1/risk/daily || echo "Health check failed (app may still be starting)"
