name: Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. v1.0.0). Leave blank for latest.'
        required: false
        default: ''

env:
  BACKEND_IMAGE: ghcr.io/jayantkeswani/stocktrading/backend
  FRONTEND_IMAGE: ghcr.io/jayantkeswani/stocktrading/frontend

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      deploy_version: ${{ steps.resolve.outputs.deploy_version }}

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version and retag
        id: resolve
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v*.*.* ]]; then
            VERSION="${{ github.ref_name }}"
            SOURCE_TAG="${{ github.sha }}"
            echo "Retagging :${SOURCE_TAG} as :${VERSION}"
            docker buildx imagetools create \
              -t "${{ env.BACKEND_IMAGE }}:${VERSION}" \
              "${{ env.BACKEND_IMAGE }}:${SOURCE_TAG}"
            docker buildx imagetools create \
              -t "${{ env.FRONTEND_IMAGE }}:${VERSION}" \
              "${{ env.FRONTEND_IMAGE }}:${SOURCE_TAG}"
            echo "image_tag=${VERSION}" >> $GITHUB_OUTPUT
            echo "deploy_version=${VERSION}" >> $GITHUB_OUTPUT

          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Retagging :latest as :${VERSION}"
            docker buildx imagetools create \
              -t "${{ env.BACKEND_IMAGE }}:${VERSION}" \
              "${{ env.BACKEND_IMAGE }}:latest"
            docker buildx imagetools create \
              -t "${{ env.FRONTEND_IMAGE }}:${VERSION}" \
              "${{ env.FRONTEND_IMAGE }}:latest"
            echo "image_tag=${VERSION}" >> $GITHUB_OUTPUT
            echo "deploy_version=${VERSION}" >> $GITHUB_OUTPUT

          else
            echo "image_tag=latest" >> $GITHUB_OUTPUT
            echo "deploy_version=latest-$(date -u +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: retag
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.prod.yml
            infrastructure/docker/nginx.conf

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync config files to VM
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml deploy@${{ secrets.GCP_VM_IP }}:/opt/stock-trading/
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.GCP_VM_IP }} "mkdir -p /opt/stock-trading/infrastructure/docker"
          scp -i ~/.ssh/deploy_key infrastructure/docker/nginx.conf deploy@${{ secrets.GCP_VM_IP }}:/opt/stock-trading/infrastructure/docker/

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.GCP_VM_IP }} << 'DEPLOY_SCRIPT'
            set -e
            cd /opt/stock-trading

            # Write .env from secrets
            cat > .env << 'ENV_EOF'
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DATABASE_URL=postgresql+asyncpg://trader:${{ secrets.DB_PASSWORD }}@postgres:5432/stocktrading
          DATABASE_URL_SYNC=postgresql://trader:${{ secrets.DB_PASSWORD }}@postgres:5432/stocktrading
          REDIS_URL=redis://redis:6379/0
          FYERS_APP_ID=${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_KEY=${{ secrets.FYERS_SECRET_KEY }}
          FYERS_REDIRECT_URI=${{ secrets.FYERS_REDIRECT_URI }}
          FYERS_USERNAME=${{ secrets.FYERS_USERNAME }}
          FYERS_PIN=${{ secrets.FYERS_PIN }}
          FYERS_TOTP_SECRET=${{ secrets.FYERS_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          GCP_PROJECT_ID=stock-trading-prod
          VERTEX_AI_LOCATION=global
          RESEARCH_LLM_PROVIDER=${{ vars.RESEARCH_LLM_PROVIDER }}
          RESEARCH_LLM_MODEL=${{ vars.RESEARCH_LLM_MODEL }}
          RESEARCH_LLM_MODEL_PRO=${{ vars.RESEARCH_LLM_MODEL_PRO }}
          TRADING_CAPITAL=1000000
          MAX_DAILY_DRAWDOWN_PCT=5.0
          MAX_RISK_PER_TRADE_PCT=2.0
          MAX_TRADES_PER_DAY=3
          PAPER_TRADING=true
          BACKEND_HOST=0.0.0.0
          BACKEND_PORT=8080
          FRONTEND_URL=http://localhost:3000
          APP_VERSION=${{ needs.retag.outputs.deploy_version }}
          ENV_EOF

            # These need shell expansion (inner heredoc is single-quoted)
            echo "DEPLOYED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .env
            echo "BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ needs.retag.outputs.image_tag }}" >> .env
            echo "FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ needs.retag.outputs.image_tag }}" >> .env

            # Login to ghcr.io and pull images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'

            docker pull "${{ env.BACKEND_IMAGE }}:${{ needs.retag.outputs.image_tag }}"
            docker pull "${{ env.FRONTEND_IMAGE }}:${{ needs.retag.outputs.image_tag }}"

            # Ensure DB is up and healthy
            docker compose -f docker-compose.prod.yml up -d postgres redis
            sleep 5

            # Run migrations via docker run (not compose run — compose run
            # pollutes service state and causes the subsequent up -d to skip
            # recreating the backend container)
            docker run --rm \
              --network stock-trading_default \
              -e DATABASE_URL="postgresql+asyncpg://trader:${DB_PASSWORD}@postgres:5432/stocktrading" \
              -e DATABASE_URL_SYNC="postgresql://trader:${DB_PASSWORD}@postgres:5432/stocktrading" \
              "${{ env.BACKEND_IMAGE }}:${{ needs.retag.outputs.image_tag }}" \
              python -m alembic upgrade head

            # Stop old app containers, then start all services with new images
            docker compose -f docker-compose.prod.yml stop backend frontend nginx 2>/dev/null || true
            docker compose -f docker-compose.prod.yml rm -f backend frontend nginx 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d

            # Verify
            sleep 5
            docker compose -f docker-compose.prod.yml ps

            # Cleanup old images (remove all images not used by running containers)
            docker image prune -a -f

            echo "Deploy complete! Version: ${{ needs.retag.outputs.deploy_version }}"
          DEPLOY_SCRIPT

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            HEALTH=$(curl -sf --max-time 10 http://${{ secrets.GCP_VM_IP }}/api/v1/health 2>/dev/null) && break
            echo "Attempt $i: backend not ready yet, waiting 10s..."
            sleep 10
          done
          HEALTH=${HEALTH:-'{"status":"unknown"}'}
          echo "Health response: $HEALTH"
          echo "$HEALTH" | grep -q '"version"' && echo "Version visible in health endpoint" || echo "WARNING: version not in health response (app may still be starting)"
