[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stocktrading-backend"
version = "0.1.0"
description = "Indian stock market options trading system"
requires-python = ">=3.11"
dependencies = [
    # Pinned: fastapi 0.137.0 added a strict "Prefix and path cannot be both empty" check that
    # rejects our @router.get("") collection routes — a non-reproducible build (the old >= floor)
    # resolved 0.137.0 and crash-looped prod on the v1.27.0 deploy. 0.136.3 + starlette 1.1.0 are
    # verified-good (app.main imports). Bump only together with migrating the empty-path routes.
    "fastapi==0.136.3",
    "starlette==1.1.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "apscheduler>=3.10.0",
    "python-telegram-bot>=21.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "mplfinance>=0.12.10b0",
    "fyers-apiv3>=3.0.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "pyotp>=2.9.0",
    "yfinance>=0.2.36",
    "google-genai>=1.0.0",
    "telethon>=1.36.0",
    # Intraday Hunter v2 teacher ingestion (YouTube plan/live videos). Deliberately a floor, not a
    # pin: YouTube breaks old yt-dlp builds, so every image rebuild should pick up the latest.
    "yt-dlp>=2026.6.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
