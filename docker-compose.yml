services:
  postgres:
    image: postgres:16-alpine
    container_name: st-postgres
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader_dev_123
      POSTGRES_DB: stocktrading
    ports:
      - "5433:5432"
    volumes:
      - st_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d stocktrading"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: st-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  st_postgres_data:
